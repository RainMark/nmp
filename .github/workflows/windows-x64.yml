name: Windows x64

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyinstaller

      - name: Run source tests
        run: python -m pytest -q

      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm nmp-client.spec

      - name: Check command-line entry point
        run: .\dist\nmp-client.exe --help

      - name: Test packaged executable end to end
        env:
          NMP_PACKAGED_EXE: ${{ github.workspace }}\dist\nmp-client.exe
        run: python -m pytest -q tests/test_packaged_client.py

      - name: Include example configuration
        run: Copy-Item nmp-client.example.toml dist\nmp-client.example.toml

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: nmp-client-windows-x64
          path: |
            dist/nmp-client.exe
            dist/nmp-client.example.toml
          if-no-files-found: error
