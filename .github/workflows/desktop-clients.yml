name: Desktop clients

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
          - name: macOS arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyinstaller

      - name: Run source tests
        run: python -m pytest -q

      - name: Build desktop app
        run: pyinstaller --clean --noconfirm nmp-gui.spec

      - name: Check packaged Windows app
        if: runner.os == 'Windows'
        run: .\dist\NMP.exe --self-test

      - name: Check packaged macOS app
        if: runner.os == 'macOS'
        run: |
          "dist/NMP.app/Contents/MacOS/NMP" --self-test
          codesign --verify --deep --strict "dist/NMP.app"

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/NMP.app" "dist/NMP-macos-arm64.zip"

      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: NMP-windows-x64
          path: dist/NMP.exe
          if-no-files-found: error

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: NMP-macos-arm64
          path: dist/NMP-macos-arm64.zip
          if-no-files-found: error
