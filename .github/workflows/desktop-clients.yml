name: Desktop clients

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
          - name: macOS arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]"
          python -m pip install pytest pyinstaller

      - name: Install Windows GUI automation
        if: runner.os == 'Windows'
        run: python -m pip install pywinauto==0.6.9

      - name: Run source tests
        run: python -m pytest -q

      - name: Build desktop app
        run: pyinstaller --clean --noconfirm nmp-gui.spec

      - name: Test packaged Windows GUI
        if: runner.os == 'Windows'
        run: python .github/scripts/windows_gui_automation.py dist/NMP.exe

      - name: Check packaged macOS app
        if: runner.os == 'macOS'
        run: |
          python .github/scripts/macos_gui_smoke.py "dist/NMP.app/Contents/MacOS/NMP"
          codesign --verify --deep --strict "dist/NMP.app"

      - name: Upload Windows GUI test diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-gui-test-diagnostics
          path: artifacts/windows-gui
          if-no-files-found: error

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/NMP.app" "dist/NMP-macos-arm64.zip"

      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: NMP-windows-x64
          path: dist/NMP.exe
          if-no-files-found: error

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: NMP-macos-arm64
          path: dist/NMP-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v7
        with:
          pattern: NMP-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        run: mv release-assets/NMP.exe release-assets/NMP-windows-x64.exe

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "NMP $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
